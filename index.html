

<!DOCTYPE html>
<html>
<head>
    <title>About Us</title>
</head>

<body>
    <div id="links">
        <a href="index.html">Home</a>
        <a href="palate.html">Palate</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </div>

    <h1>Welcome to YourSpace!</h1>
    <p>Here are some recent posts:</p>

    <div id="posts"></div>

    <script>
        async function loadPosts() {
            const gallery = document.getElementById('posts');

            try {
                const response = await fetch('/api/posts');

                if (!response.ok) {
                    throw new Error('Could not retrieve posts.');
                }

                const posts = await response.json();

                gallery.innerHTML = '';

                if (posts.length === 0) {
                    gallery.textContent = 'No posts yet!';
                    return;
                }

                posts.forEach(post => {
                    // Container for each post
                    const postDiv = document.createElement('div');

                    postDiv.style.margin = '20px';
                    postDiv.style.display = 'inline-block';
                    postDiv.style.verticalAlign = 'top';

                    // Post image
                    const img = document.createElement('img');

                    img.src = post.imagePath;
                    img.alt = post.name;
                    img.style.width = '200px';
                    img.style.display = 'block';

                    // Post name
                    const name = document.createElement('h3');

                    name.textContent = post.name;

                    // Post date
                    const date = document.createElement('p');

                    date.textContent =
                        new Date(post.createdAt).toLocaleString();

                    // Add everything to the page
                    postDiv.appendChild(img);
                    postDiv.appendChild(name);
                    postDiv.appendChild(date);

                    gallery.appendChild(postDiv);
                });

            } catch (error) {
                console.error('Error loading posts:', error);
                gallery.textContent = 'Could not load posts.';
            }
        }

        loadPosts();
    </script>
</body>
</html>
